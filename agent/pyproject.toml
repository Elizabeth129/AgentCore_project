[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csagent"
version = "0.1.0"
description = "Customer Support Agent on Amazon Bedrock AgentCore Runtime (Strands)"
requires-python = ">=3.12"
dependencies = [
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "mcp ~= 1.24.0",
    "strands-agents >= 1.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
